name: Flutter Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: "17.x"
        cache: gradle

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true

    - name: Read version from pubspec.yaml
      id: read_version
      run: echo "VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)" >> $GITHUB_ENV

    - name: Download Android keystore
      id: android_keystore
      uses: timheuer/base64-to-file@v1.0.3
      with:
        fileName: upload-keystore.jks
        encodedString: ${{ secrets.KEYSTORE_BASE64 }}
    - name: Create key.properties
      run: |
        echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > android/key.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties

    - name: Get dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

    - name: Build App Bundle
      run: flutter build appbundle --release --android-skip-build-dependency-validation

    - name: Create GitHub Release and Upload Assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Coram-Deo-armeabi-v7a-${{ env.VERSION }}.apk
        cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Coram-Deo-arm64-v8a-${{ env.VERSION }}.apk
        cp build/app/outputs/flutter-apk/app-x86_64-release.apk Coram-Deo-x86_64-${{ env.VERSION }}.apk
        cp build/app/outputs/bundle/release/app-release.aab Coram-Deo-${{ env.VERSION }}.aab
        if gh release view "${{ env.VERSION }}" >/dev/null 2>&1; then
          echo "Release exists, uploading assets..."
          gh release upload "${{ env.VERSION }}" \
            Coram-Deo-armeabi-v7a-${{ env.VERSION }}.apk \
            Coram-Deo-arm64-v8a-${{ env.VERSION }}.apk \
            Coram-Deo-x86_64-${{ env.VERSION }}.apk \
            Coram-Deo-${{ env.VERSION }}.aab \
            --clobber
        else
          echo "Creating release..."
          gh release create "${{ env.VERSION }}" \
            Coram-Deo-armeabi-v7a-${{ env.VERSION }}.apk \
            Coram-Deo-arm64-v8a-${{ env.VERSION }}.apk \
            Coram-Deo-x86_64-${{ env.VERSION }}.apk \
            Coram-Deo-${{ env.VERSION }}.aab \
            --title "Release ${{ env.VERSION }}" \
            --notes "Release ${{ env.VERSION }}"
        fi
